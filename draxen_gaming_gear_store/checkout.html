    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Radio button visual states logic
            const radioButtons = document.querySelectorAll('input[name="payment_method"]');

            function updateRadioStyles() {
                radioButtons.forEach(radio => {
                    const parent = radio.closest('label');
                    const indicator = parent.querySelector('.h-2\\.5');
                    const indicatorBorder = parent.querySelector('.h-5');

                    if (radio.checked) {
                        parent.classList.add('border-secondary', 'bg-surface-container-highest/30', 'shadow-[0_0_15px_rgba(70,245,224,0.15)]');
                        parent.classList.remove('border-outline-variant', 'bg-surface-container-low', 'hover:border-outline', 'hover:bg-surface-container');
                        indicatorBorder.classList.add('border-secondary');
                        indicatorBorder.classList.remove('border-outline-variant');
                        indicator.classList.add('bg-secondary');
                        indicator.classList.remove('bg-transparent');
                    } else {
                        parent.classList.remove('border-secondary', 'bg-surface-container-highest/30', 'shadow-[0_0_15px_rgba(70,245,224,0.15)]');
                        parent.classList.add('border-outline-variant', 'bg-surface-container-low', 'hover:border-outline', 'hover:bg-surface-container');
                        indicatorBorder.classList.remove('border-secondary');
                        indicatorBorder.classList.add('border-outline-variant');
                        indicator.classList.remove('bg-secondary');
                        indicator.classList.add('bg-transparent');
                    }
                });
            }

            radioButtons.forEach(radio => {
                radio.addEventListener('change', updateRadioStyles);
            });

            // Dynamic Cart Loading & Totals Logic
            const itemsList = document.getElementById('checkout-items-list');
            const countEl = document.getElementById('summary-count');
            const subtotalEl = document.getElementById('summary-subtotal');
            const shippingEl = document.getElementById('summary-shipping');
            const taxEl = document.getElementById('summary-tax');
            const totalEl = document.getElementById('summary-total');
            const placeOrderBtn = document.getElementById('btn-place-order');

            const cart = JSON.parse(localStorage.getItem('draxen_cart_v1') || '[]');

            if (cart.length === 0) {
                alert('Your cart is empty. Redirecting to home...');
                window.location.href = '/';
                return;
            }

            function formatMoney(val) {
                return '$' + Number(val || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            // Render items
            countEl.textContent = `${cart.reduce((sum, i) => sum + i.quantity, 0)} ITEMS`;
            itemsList.innerHTML = cart.map(item => `
                    <div class="flex gap-4 items-center">
                        <div class="w-16 h-16 rounded bg-surface-container-low border border-outline-variant/50 overflow-hidden flex-shrink-0 flex items-center justify-center">
                            <span class="material-symbols-outlined text-3xl text-outline opacity-30 select-none">shopping_bag</span>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-body-md text-body-md text-on-surface font-medium line-clamp-1">${item.name}</h3>
                            <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Qty: ${item.quantity}</p>
                        </div>
                        <div class="font-body-md text-body-md text-secondary font-semibold">
                            ${formatMoney(item.price * item.quantity)}
                        </div>
                    </div>
                `).join('');

            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const shipping = subtotal >= 150 ? 0 : 12.99;
            const tax = subtotal * 0.07;
            const total = subtotal + shipping + tax;

            subtotalEl.textContent = formatMoney(subtotal);
            shippingEl.textContent = shipping === 0 ? 'FREE' : formatMoney(shipping);
            taxEl.textContent = formatMoney(tax);
            totalEl.textContent = formatMoney(total);

            // Place Order Action Handler
            placeOrderBtn.addEventListener('click', async () => {
                const firstName = document.getElementById('first-name').value.trim();
                const lastName = document.getElementById('last-name').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const address = document.getElementById('address').value.trim();
                const city = document.getElementById('city').value.trim();
                const postalCode = document.getElementById('postal-code').value.trim();
                const paymentMethod = document.querySelector('input[name="payment_method"]:checked').value;

                if (!firstName || !lastName || !email || !phone || !address || !city) {
                    alert('Please complete all required fields.');
                    return;
                }

                placeOrderBtn.disabled = true;
                placeOrderBtn.textContent = 'Processing Transaction...';

                const payload = {
                    name: `${firstName} ${lastName}`,
                    email,
                    phone,
                    address,
                    city,
                    postalCode,
                    paymentMethod,
                    items: cart
                };

                try {
                    const response = await fetch('/api/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Failed to process transaction.');

                    localStorage.removeItem('draxen_cart_v1');
                    alert(`Transaction authorized! Order Code: ${result.order.id}. Check your email.`);
                    window.location.href = '/';
                } catch (error) {
                    alert('Secure payment gateway error: ' + error.message);
                    placeOrderBtn.disabled = false;
                    placeOrderBtn.textContent = 'Place Order';
                }
            });

            updateRadioStyles();
        });
    </script>
    <script src="/shared.js"></script>
</body>

</html>
