<!DOCTYPE html>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",

                        "on-background": "#e5e2e1",

    <style>
        .glow-text {
            text-shadow: 0 0 15px rgba(70, 245, 224, 0.6);
        }
        .glow-primary {
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
        }
        .scanline {
            width: 100%;
            height: 100px;
            background: linear-gradient(0deg, rgba(0, 242, 255, 0) 0%, rgba(0, 242, 255, 0.1) 50%, rgba(0, 242, 255, 0) 100%);
            position: absolute;
            top: -100px;
            left: 0;
            animation: scanline 6s linear infinite;
        }
        @keyframes scanline {
            to { top: 100%; }
        }

            <a href="/contact" class="flex-1 py-4 bg-surface border border-outline-variant text-secondary font-label-sm text-label-sm font-bold uppercase tracking-wider rounded-lg hover:bg-surface-bright transition-all flex items-center justify-center gap-2">

    <footer class="absolute bottom-8 text-center opacity-40 font-label-sm text-label-sm">
